<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战 · Battle City</title>
<style>
  :root {
    --bg: #0b0f0a;
    --panel: #131a11;
    --line: #2a3a24;
    --accent: #7ce65c;
    --accent-dim: #4a9a3a;
    --gold: #ffcf3f;
    --text: #d8f0cf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 20%, #16210f 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Consolas", "Courier New", ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    gap: 12px;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255, 207, 63, 0.5);
    font-weight: 700;
  }
  h1 small { display: block; font-size: 10px; color: var(--accent-dim); letter-spacing: 2px; }
  #game {
    display: flex;
    gap: 12px;
    align-items: stretch;
    flex-wrap: wrap;
    justify-content: center;
  }
  #cv {
    background: #000;
    border: 3px solid var(--line);
    box-shadow: 0 0 0 3px #050805, 0 10px 30px rgba(0,0,0,0.6);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: min(90vw, 440px);
    height: min(90vw, 440px);
  }
  #hud {
    background: var(--panel);
    border: 3px solid var(--line);
    padding: 12px 14px;
    min-width: 150px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13px;
    align-self: stretch;
  }
  .row { display: flex; flex-direction: column; gap: 3px; }
  .row .lbl { font-size: 10px; color: var(--accent-dim); letter-spacing: 2px; }
  .row .val { font-size: 18px; color: var(--text); font-weight: 700; }
  .lives, .enemy-count { display: flex; gap: 4px; flex-wrap: wrap; }
  .tank-ico { width: 16px; height: 16px; background: var(--gold); border-radius: 3px; position: relative; }
  .tank-ico::after { content: ""; position: absolute; top: -3px; left: 6px; width: 4px; height: 5px; background: #5b4600; }
  .tank-ico.e { background: #b8bcc2; }
  .tank-ico.e::after { background: #666; }
  #hud .key { color: var(--gold); }
  .muted { opacity: .4; }
  #status {
    font-size: 14px;
    color: var(--gold);
    text-align: center;
    min-height: 20px;
    letter-spacing: 1px;
  }
  #help { font-size: 11px; color: var(--accent-dim); text-align: center; line-height: 1.7; }
  #help b { color: var(--text); }
  /* touch controls */
  #touch { display: none; gap: 10px; align-items: center; }
  #dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
  #dpad button {
    width: 52px; height: 52px; font-size: 20px; background: var(--panel);
    color: var(--text); border: 2px solid var(--line); border-radius: 8px;
    touch-action: manipulation;
  }
  #dpad button:active { background: var(--accent-dim); color: #000; }
  #dpad .up { grid-column: 2; grid-row: 1; }
  #dpad .left { grid-column: 1; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  #dpad .down { grid-column: 2; grid-row: 3; }
  #fire {
    width: 84px; height: 84px; border-radius: 50%; font-size: 16px;
    background: #6b2413; color: #ffd9c9; border: 3px solid #a63a1f;
    letter-spacing: 1px; touch-action: manipulation;
  }
  #fire:active { background: #a63a1f; }
  #touch-actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #confirm, #back {
    width: 72px; height: 40px; font-size: 14px; line-height: 1.2;
    background: var(--panel); color: var(--text); border: 2px solid var(--line);
    border-radius: 8px; touch-action: manipulation; letter-spacing: 1px;
  }
  #confirm { color: var(--gold); border-color: #6b5a1f; }
  #confirm:active { background: #3a3315; }
  #back { color: #ffb3a3; border-color: #6b3a1f; }
  #back:active { background: #3a1f15; }
  @media (pointer: coarse) { #touch { display: flex; } }
  @media (max-width: 640px) {
    #game { flex-direction: column; align-items: center; }
    #hud { flex-direction: row; flex-wrap: wrap; min-width: 0; width: min(90vw,440px); justify-content: space-between; }
  }
</style>
</head>
<body>
  <h1>坦克大战 <small>BATTLE CITY</small></h1>
  <div id="game">
    <canvas id="cv" width="416" height="416"></canvas>
    <div id="hud">
      <div class="row"><span class="lbl">得分 SCORE</span><span class="val" id="score">0</span></div>
      <div class="row"><span class="lbl">最高 HI-SCORE</span><span class="val" id="hi">0</span></div>
      <div class="row"><span class="lbl">关卡 STAGE</span><span class="val" id="stage">1</span></div>
      <div class="row"><span class="lbl">生命 LIVES</span><span class="lives" id="lives"></span></div>
      <div class="row"><span class="lbl">敌军 ENEMY</span><span class="enemy-count" id="enemies"></span></div>
      <div class="row"><span class="lbl">基地 BASE</span><span class="val" id="base-hp">3</span></div>
      <div class="row"><span class="lbl" id="pwr-lbl">状态 NONE</span></div>
    </div>
  </div>
  <div id="status">按 <span class="key">Enter</span> 开始游戏</div>
  <div id="touch">
    <div id="dpad">
      <button class="up" data-k="up">▲</button>
      <button class="left" data-k="left">◀</button>
      <button class="right" data-k="right">▶</button>
      <button class="down" data-k="down">▼</button>
    </div>
    <div id="touch-actions">
      <button id="confirm">确定<br>ENTER</button>
      <button id="back">返回<br>ESC</button>
      <button id="fire">开火<br>FIRE</button>
    </div>
  </div>
  <div id="help">
    <b>方向键 / WASD</b> 移动 · <b>空格 / J</b> 开火 · <b>P</b> 暂停 · <b>M</b> 静音<br>
    保护基地 🚩 不被击毁，消灭全部敌军即可过关
  </div>

<script>
"use strict";

/* ================= 常量 ================= */
const TILE = 32, GRID = 13, CANVAS = TILE * GRID;
const TANK = 28, TANK_PAD = (TILE - TANK) / 2;

const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, GRASS = 4, BASE = 5;

const DIRS = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };

const PUP_TYPES = ["shield", "star", "bomb", "life"];
const BASE_HP = 3;                    // 基地初始血量
const MAX_LIVES = 3;                  // 玩家初始生命（满血）

/* ================= 关卡地图 ================= */
const MAPS = [
  [ // Stage 1
    ".............",
    ".#.#.#.#.#.#.",
    ".#.#.#.#.#.#.",
    "..X.......X..",
    "..#..###..#..",
    "....#.#.#....",
    "..%.#.#.#.%..",
    "....#.#.#....",
    "..#..###..#..",
    "..#.......#..",
    "....#####....",
    "....#.#.#....",
    "......B......",
  ],
  [ // Stage 2
    ".............",
    ".#.#.#.#.#.#.",
    ".X.#.#.#.#.X.",
    "..X..###..X..",
    "....#.#.#....",
    "..%.#...#.%..",
    "..~~~~~~~....",
    "....#.#.#....",
    "..X..###..X..",
    ".#.........#.",
    ".#..#####..#.",
    "....#.#.#....",
    "......B......",
  ],
  [ // Stage 3
    ".............",
    ".#.#.#.#.#.#.",
    ".#.#.#.#.#.#.",
    "..X.......X..",
    "....#####....",
    "..%.#...#.%..",
    ".#...#.#...#.",
    ".#..##.##..#.",
    "..#..#.#..#..",
    "..~..~.~..~..",
    "..#..###..#..",
    "....#.#.#....",
    "......B......",
  ],
];

/* ================= 状态 ================= */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let grid, tanks, bullets, pups, particles;
let player, score, hiscore, lives, stage, remaining, spawnTimer, spawnPoint;
let state = "title";          // title | levelselect | playing | paused | gameover | levelclear | win
let menuIndex = 0;            // 菜单当前选中项
let frame = 0;
let keys = {};
let lastDir = "up";
let playerShootCd = 0;
let shake = 0, shakeX = 0, shakeY = 0;
let baseHp = BASE_HP, baseFlash = 0;

const SPAWN_POINTS = [[0,0], [6,0], [12,0]];
const PLAYER_SPAWN = [4 * TILE, 12 * TILE];
const MAX_ALIVE = 4;

/* 敌军配置 */
const ENEMY_TYPES = {
  basic: { hp: 1, speed: 0.8,  bulletSpeed: 3.2, color: "#c6cad2", shoot: 90, score: 100 },
  fast:  { hp: 1, speed: 1.5,  bulletSpeed: 4.0, color: "#9fd08a", shoot: 80, score: 200 },
  power: { hp: 1, speed: 0.9,  bulletSpeed: 5.0, color: "#e8b95a", shoot: 55, score: 300 },
  armor: { hp: 4, speed: 0.75, bulletSpeed: 3.2, color: "#7f8b99", shoot: 110, score: 400 },
};

/* ================= 音频 ================= */
let audioCtx = null, muted = false;
function ac() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  return audioCtx;
}
function beep(freq, dur, type, vol) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.value = vol || 0.08;
  o.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  shoot:   () => beep(880, 0.06, "square", 0.05),
  eshoot:  () => beep(440, 0.06, "square", 0.04),
  hit:     () => beep(180, 0.12, "sawtooth", 0.12),
  move:    () => beep(560, 0.04, "square", 0.05),
  brick:   () => beep(120, 0.08, "square", 0.07),
  explode: () => beep(90, 0.4, "sawtooth", 0.2),
  pickup:  () => { beep(660, 0.07, "square", 0.08); setTimeout(()=>beep(990, 0.09, "square", 0.08), 70); },
  start:   () => { beep(440, 0.08, "square", 0.07); setTimeout(()=>beep(880, 0.12, "square", 0.07), 90); },
  gameover:() => { beep(300, 0.2, "sawtooth", 0.12); setTimeout(()=>beep(150, 0.4, "sawtooth", 0.12), 180); },
};

/* ================= 工具 ================= */
function tileAt(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= GRID || ty >= GRID) return STEEL; // 边界视为钢墙
  return grid[ty][tx];
}
function loadMap(m) {
  grid = m.map(r => (r.padEnd(GRID, ".").slice(0, GRID)).split("")
    .map(ch => ({ ".":EMPTY, "#":BRICK, "X":STEEL, "~":WATER, "%":GRASS, "B":BASE }[ch] ?? EMPTY)));
}
function rectHitsSolid(x, y, w, h) {
  const x0 = Math.floor(x / TILE), y0 = Math.floor(y / TILE);
  const x1 = Math.floor((x + w - 1) / TILE), y1 = Math.floor((y + h - 1) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++) {
      const t = tileAt(tx, ty);
      if (t === BRICK || t === STEEL || t === WATER || t === BASE) return true;
    }
  return false;
}
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function tankBlocked(nx, ny, self) {
  if (nx < 0 || ny < 0 || nx + TANK > CANVAS || ny + TANK > CANVAS) return true;
  if (rectHitsSolid(nx, ny, TANK, TANK)) return true;
  for (const t of tanks) {
    if (t === self) continue;
    if (aabb(nx, ny, TANK, TANK, t.x, t.y, TANK, TANK)) return true;
  }
  return false;
}
function center(t) { return { x: t.x + TANK / 2, y: t.y + TANK / 2 }; }

/* ================= 实体 ================= */
function makeTank(x, y, dir, isEnemy, type) {
  const cfg = isEnemy ? ENEMY_TYPES[type] : null;
  return {
    x, y, dir, isEnemy, type: type || "player",
    hp: isEnemy ? cfg.hp : 1,
    speed: isEnemy ? cfg.speed : 2.2,
    bulletSpeed: isEnemy ? cfg.bulletSpeed : 5.0,
    shootTimer: 0, dirTimer: 0,
    invincible: 0,           // 玩家无敌帧数
    power: 0,                // 玩家强化(可破钢)帧数
    shield: 0,               // 玩家护盾帧数
    flash: 0,                // 被击中闪烁
    spawn: 40,               // 出生保护动画帧数
  };
}

function makeBullet(owner, x, y, dir, speed) {
  return { owner, x, y, dir, speed, power: owner === "player" && player.power > 0 };
}

/* ================= 初始化 / 关卡 ================= */
function resetAll() {
  hiscore = Math.max(hiscore, +(localStorage.getItem("tank-hi") || 0));
  startGame(1);
}
function startGame(s) {
  score = 0; stage = s;
  startStage();                 // 重置生命、基地血量、敌人等
  updateHUD();
  sfx.start();
  setStatus("战斗中…");
}
function startStage() {
  loadMap(MAPS[(stage - 1) % MAPS.length]);
  tanks = []; bullets = []; pups = []; particles = [];
  player = makeTank(PLAYER_SPAWN[0], PLAYER_SPAWN[1], "up", false);
  tanks.push(player);
  remaining = 6 + stage * 3;      // 每关敌军数量（初始较少）
  baseHp = BASE_HP; baseFlash = 0;
  lives = MAX_LIVES;               // 进入新关卡时生命回满
  spawnTimer = 60; spawnPoint = 0;
  playerShootCd = 0;
  state = "playing";
}
function spawnEnemy() {
  const pool = Object.keys(ENEMY_TYPES);
  // 关卡越靠后越容易出现更强的敌人
  let type = "basic";
  const r = Math.random();
  if (stage >= 3 && r < 0.3) type = "armor";
  else if (stage >= 2 && r < 0.6) type = "power";
  else if (r < 0.75) type = "fast";

  for (let i = 0; i < SPAWN_POINTS.length; i++) {
    const [tx, ty] = SPAWN_POINTS[spawnPoint % SPAWN_POINTS.length];
    spawnPoint++;
    const x = tx * TILE, y = ty * TILE;
    if (tankBlocked(x, y, null)) continue;
    const e = makeTank(x, y, "down", true, type);
    e.spawn = 60;
    tanks.push(e);
    sfx.start();
    return true;
  }
  return false;
}

/* ================= 玩家输入 ================= */
function dirFromKeys() {
  if (keys["ArrowUp"] || keys["w"] || keys["W"] || keys["up"]) return "up";
  if (keys["ArrowDown"] || keys["s"] || keys["S"] || keys["down"]) return "down";
  if (keys["ArrowLeft"] || keys["a"] || keys["A"] || keys["left"]) return "left";
  if (keys["ArrowRight"] || keys["d"] || keys["D"] || keys["right"]) return "right";
  return null;
}
function updatePlayer() {
  const dir = dirFromKeys();
  if (dir) lastDir = dir;
  if (playerShootCd > 0) playerShootCd--;

  if (dir) {
    player.dir = dir;
    const [dx, dy] = DIRS[dir];
    const nx = player.x + dx * player.speed;
    if (!tankBlocked(nx, player.y, player)) player.x = nx;
    const ny = player.y + dy * player.speed;
    if (!tankBlocked(player.x, ny, player)) player.y = ny;
  }
  if (keys[" "] || keys["Space"] || keys["j"] || keys["J"] || keys["fire"]) {
    tryShoot(player, "player");
  }
  if (player.invincible > 0) player.invincible--;
  if (player.power > 0) player.power--;
  if (player.shield > 0) player.shield--;
  if (player.flash > 0) player.flash--;
}
function tryShoot(t, owner) {
  const n = bullets.filter(b => b.owner === owner).length;
  if (n >= (owner === "player" ? 2 : 1)) return;
  if (owner === "player" && playerShootCd > 0) return;
  const c = center(t);
  const b = makeBullet(owner, c.x, c.y, t.dir, t.bulletSpeed);
  bullets.push(b);
  if (owner === "player") { playerShootCd = 14; sfx.shoot(); }
  else sfx.eshoot();
}

/* ================= 敌军 AI ================= */
function updateEnemy(e) {
  if (e.spawn > 0) { e.spawn--; return; }
  if (e.shootTimer > 0) e.shootTimer--;
  if (e.dirTimer <= 0) {
    e.dirTimer = 40 + Math.floor(Math.random() * 120);
    e.dir = ["up","down","left","right"][Math.floor(Math.random() * 4)];
  }
  e.dirTimer--;

  const [dx, dy] = DIRS[e.dir];
  const nx = e.x + dx * e.speed;
  if (tankBlocked(nx, e.y, e)) { e.dirTimer = 0; }
  else e.x = nx;
  const ny = e.y + dy * e.speed;
  if (tankBlocked(e.x, ny, e)) { e.dirTimer = 0; }
  else e.y = ny;

  // 开火：部分敌人会瞄准玩家
  if (e.shootTimer <= 0 && player.hp > 0) {
    e.shootTimer = e.type === "power" ? 40 + Math.floor(Math.random() * 30)
                  : 60 + Math.floor(Math.random() * 90);
    if (Math.random() < 0.45) {
      const c = center(e), pc = center(player);
      const ddx = pc.x - c.x, ddy = pc.y - c.y;
      e.dir = Math.abs(ddx) > Math.abs(ddy) ? (ddx > 0 ? "right" : "left")
                                            : (ddy > 0 ? "down" : "up");
    }
    tryShoot(e, "enemy");
  }
}

/* ================= 子弹 ================= */
function updateBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (b.dead) continue;
    const [dx, dy] = DIRS[b.dir];
    b.x += dx * b.speed;
    b.y += dy * b.speed;

    if (b.x < 0 || b.y < 0 || b.x > CANVAS || b.y > CANVAS) { b.dead = true; continue; }

    // 与地砖碰撞
    const tx = Math.floor(b.x / TILE), ty = Math.floor(b.y / TILE);
    const t = tileAt(tx, ty);
    if (t === BRICK) {
      grid[ty][tx] = EMPTY; b.dead = true;
      spawnParticles(tx * TILE + 16, ty * TILE + 16, "#b5651d"); sfx.brick();
      score += 5; continue;
    }
    if (t === STEEL) {
      if (b.power) { grid[ty][tx] = EMPTY; sfx.brick(); spawnParticles(tx*TILE+16, ty*TILE+16, "#9aa0a6"); }
      b.dead = true; continue;
    }
    if (t === BASE) {
      b.dead = true;
      if (b.owner === "player") continue;   // 自己的子弹不能误伤基地
      baseHp--;
      baseFlash = 12;
      spawnParticles(tx * TILE + 16, ty * TILE + 16, "#ff6b4a", 20);
      sfx.hit();
      if (baseHp <= 0) {
        grid[ty][tx] = EMPTY;
        spawnParticles(tx * TILE + 16, ty * TILE + 16, "#ff6b4a", 30);
        gameOver(); return;
      }
      continue;
    }

    // 与坦克碰撞
    let hit = false;
    for (const t of tanks) {
      if (t.hp <= 0) continue;
      if (b.owner === "player" && t.isEnemy === false) continue;
      if (b.owner === "enemy" && t.isEnemy === true) continue;
      if (aabb(b.x - 2, b.y - 2, 5, 5, t.x, t.y, TANK, TANK)) {
        b.dead = true;
        damageTank(t, b);
        hit = true;
        break;
      }
    }
    if (hit) continue;

    // 子弹对撞（两发对向子弹同帧销毁）
    for (let j = 0; j < bullets.length; j++) {
      if (j === i) continue;
      const o = bullets[j];
      if (o.dead) continue;
      if (o.owner === b.owner) continue;
      if (Math.abs(o.x - b.x) < 6 && Math.abs(o.y - b.y) < 6) {
        b.dead = true; o.dead = true;
        spawnParticles(b.x, b.y, "#fff", 8);
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
}

function damageTank(t, b) {
  if (t.isEnemy) {
    t.hp--; t.flash = 8; sfx.hit();
    if (t.hp <= 0) destroyEnemy(t);
  } else {
    if (t.invincible > 0 || t.shield > 0) { sfx.hit(); return; }
    loseLife();
  }
}
function destroyEnemy(e) {
  const idx = tanks.indexOf(e);
  if (idx >= 0) tanks.splice(idx, 1);
  const c = center(e);
  spawnParticles(c.x, c.y, e.type === "armor" ? "#7f8b99" : "#ff8a3a", 26);
  sfx.explode();
  shake = 6;
  score += ENEMY_TYPES[e.type].score;
  // 掉落道具
  if (Math.random() < 0.28) spawnPup();
  updateHUD();
}
function loseLife() {
  const c = center(player);
  spawnParticles(c.x, c.y, "#ffcf3f", 26);
  sfx.explode(); shake = 8;
  lives--;
  if (lives <= 0) { gameOver(); return; }
  // 复活：只保留敌军，重建玩家
  tanks = tanks.filter(t => t.isEnemy);
  player = makeTank(PLAYER_SPAWN[0], PLAYER_SPAWN[1], "up", false);
  player.invincible = 180;   // 3 秒无敌
  tanks.push(player);
  updateHUD();
}

/* ================= 道具 ================= */
function spawnPup() {
  const type = PUP_TYPES[Math.floor(Math.random() * PUP_TYPES.length)];
  for (let tries = 0; tries < 40; tries++) {
    const tx = Math.floor(Math.random() * GRID), ty = Math.floor(Math.random() * GRID);
    if (tileAt(tx, ty) !== EMPTY) continue;
    const x = tx * TILE + 2, y = ty * TILE + 2;
    if (rectHitsSolid(x, y, TANK, TANK)) continue;
    pups.push({ type, x, y, life: 900 });
    return;
  }
}
function updatePups() {
  for (let i = pups.length - 1; i >= 0; i--) {
    const p = pups[i];
    if (--p.life <= 0) { pups.splice(i, 1); continue; }
    if (aabb(player.x, player.y, TANK, TANK, p.x, p.y, TANK, TANK)) {
      applyPup(p.type); pups.splice(i, 1);
    }
  }
}
function applyPup(type) {
  sfx.pickup();
  switch (type) {
    case "shield": player.shield = 600; break;
    case "star":   player.power = 900; break;
    case "bomb":
      for (let i = tanks.length - 1; i >= 0; i--) {
        const t = tanks[i];
        if (t.isEnemy && t.hp > 0) { const c = center(t); spawnParticles(c.x, c.y, "#ff8a3a", 22); tanks.splice(i, 1); score += 200; }
      }
      sfx.explode(); shake = 10; break;
    case "life": lives = Math.min(9, lives + 1); break;
  }
  updateHUD();
}

/* ================= 粒子 / 爆炸 ================= */
function spawnParticles(x, y, color, n) {
  n = n || 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 20 + Math.random() * 15, color });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ================= 胜负判定 ================= */
function checkWin() {
  if (state !== "playing") return;   // 本帧已死亡/基地被毁，则不再判胜
  const alive = tanks.some(t => t.isEnemy && t.hp > 0);
  if (remaining <= 0 && !alive) {
    score += 500;
    updateHUD();
    if (stage >= MAPS.length) { state = "win"; setStatus("🎉 恭喜通关！得分 " + score); saveHi(); }
    else { state = "levelclear"; setStatus("关卡 " + stage + " 完成！按 Enter 进入下一关"); saveHi(); }
  }
}
function gameOver() {
  state = "gameover";
  saveHi();
  sfx.gameover();
  setStatus("💥 基地被毁 / 阵亡！按 Enter 重开本关（Esc 返回菜单）");
}
function saveHi() {
  if (score > hiscore) { hiscore = score; localStorage.setItem("tank-hi", hiscore); }
}

/* ================= 更新 ================= */
function update() {
  if (state !== "playing") return;
  frame++;
  if (shake > 0) { shake--; shakeX = (Math.random() - 0.5) * shake * 1.4; shakeY = (Math.random() - 0.5) * shake * 1.4; }
  else shakeX = shakeY = 0;
  if (baseFlash > 0) baseFlash--;

  updatePlayer();

  // 敌军生成
  if (remaining > 0) {
    if (spawnTimer <= 0) {
      const alive = tanks.filter(t => t.isEnemy).length;
      if (alive < MAX_ALIVE) {
        if (spawnEnemy()) remaining--;
        spawnTimer = 90 + Math.floor(Math.random() * 60);
      } else spawnTimer = 20;
    } else spawnTimer--;
  }

  for (const e of tanks) if (e.isEnemy) updateEnemy(e);
  updateBullets();
  updatePups();
  updateParticles();
  checkWin();
  updateHUD();
}

/* ================= 绘制 ================= */
function draw() {
  ctx.save();
  ctx.clearRect(0, 0, CANVAS, CANVAS);
  ctx.translate(shakeX, shakeY);

  drawTiles();
  drawBase();
  for (const p of pups) drawPup(p);
  for (const t of tanks) if (t.hp > 0) drawTank(t);
  for (const b of bullets) drawBullet(b);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 35);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  drawOverlay();
  ctx.restore();
}

function drawTiles() {
  for (let ty = 0; ty < GRID; ty++)
    for (let tx = 0; tx < GRID; tx++) {
      const t = grid[ty][tx];
      if (t === EMPTY) continue;
      const x = tx * TILE, y = ty * TILE;
      if (t === BRICK) {
        ctx.fillStyle = "#7a3d12"; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#c06a1f";
        ctx.fillRect(x + 1, y + 1, 14, 14); ctx.fillRect(x + 17, y + 1, 14, 14);
        ctx.fillRect(x + 1, y + 17, 14, 14); ctx.fillRect(x + 17, y + 17, 14, 14);
        ctx.fillStyle = "#4a250b";
        ctx.fillRect(x, y + 15, TILE, 2); ctx.fillRect(x + 15, y, 2, TILE);
      } else if (t === STEEL) {
        ctx.fillStyle = "#5b6066"; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#9aa3ad"; ctx.fillRect(x + 2, y + 2, 12, 12); ctx.fillRect(x + 18, y + 2, 12, 12);
        ctx.fillRect(x + 2, y + 18, 12, 12); ctx.fillRect(x + 18, y + 18, 12, 12);
        ctx.fillStyle = "#d5dbe2";
        ctx.fillRect(x + 4, y + 4, 4, 4); ctx.fillRect(x + 20, y + 4, 4, 4);
      } else if (t === WATER) {
        ctx.fillStyle = "#1d4f8b"; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#3f86c9";
        const w = (frame >> 2) % 3;
        ctx.fillRect(x + 3 + w * 3, y + 4, 12, 3);
        ctx.fillRect(x + 8 - w * 2, y + 16, 14, 3);
        ctx.fillRect(x + 5, y + 25, 10, 3);
      } else if (t === GRASS) {
        ctx.fillStyle = "#2c7a32"; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#3fa34d";
        ctx.fillRect(x + 4, y + 6, 6, 8); ctx.fillRect(x + 18, y + 4, 6, 8);
        ctx.fillRect(x + 8, y + 20, 6, 8); ctx.fillRect(x + 20, y + 20, 6, 8);
      }
    }
}

function drawBase() {
  // 基地旗帜
  for (let ty = 0; ty < GRID; ty++)
    for (let tx = 0; tx < GRID; tx++) {
      if (grid[ty][tx] !== BASE) continue;
      const x = tx * TILE, y = ty * TILE;
      ctx.fillStyle = "#8a8f96"; ctx.fillRect(x + 6, y + 4, 20, 26);       // 底座
      ctx.fillStyle = "#c8ccd2"; ctx.fillRect(x + 14, y + 2, 4, 28);       // 旗杆
      ctx.fillStyle = "#e23b2e"; ctx.fillRect(x + 18, y + 2, 10, 8);       // 旗帜
      ctx.fillStyle = "#fff"; ctx.fillRect(x + 21, y + 4, 3, 3);           // 星
      // 基地血量指示
      ctx.fillStyle = "#5ee35a";
      for (let i = 0; i < baseHp; i++) ctx.fillRect(x + 4 + i * 6, y + 28, 4, 3);
      // 受击闪红
      if (baseFlash > 0) {
        ctx.fillStyle = "rgba(255,60,40,0.5)";
        ctx.fillRect(x, y, TILE, TILE);
      }
    }
}

function drawTank(t) {
  const x = t.x, y = t.y;
  const cx = x + TANK / 2, cy = y + TANK / 2;
  let body, turret, barrel;
  if (t.isEnemy) {
    body = ENEMY_TYPES[t.type].color;
    turret = "#4a5058"; barrel = "#2c2f33";
  } else {
    body = t.shield > 0 ? "#6fe3ff" : "#ffcf3f";
    turret = "#6b4d00"; barrel = "#3a2a00";
  }
  if (t.flash > 0 && (t.flash & 1)) { body = "#ffffff"; turret = "#ddd"; }

  ctx.save();
  ctx.translate(cx, cy);
  const ang = { up: 0, down: Math.PI, left: -Math.PI / 2, right: Math.PI / 2 }[t.dir];
  ctx.rotate(ang);

  // 履带
  ctx.fillStyle = "#3a3a3a";
  ctx.fillRect(-TANK / 2, -TANK / 2, TANK, 6);
  ctx.fillRect(-TANK / 2, TANK / 2 - 6, TANK, 6);
  // 车身
  ctx.fillStyle = body;
  ctx.fillRect(-TANK / 2, -TANK / 2 + 6, TANK, TANK - 12);
  // 炮塔
  ctx.fillStyle = turret;
  ctx.fillRect(-6, -6, 12, 12);
  // 炮管
  ctx.fillStyle = barrel;
  ctx.fillRect(-3, -TANK / 2 - 2, 6, TANK / 2 - 4);
  ctx.restore();

  // 出生保护闪烁
  if (t.spawn > 0 && (frame >> 2 & 1)) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.strokeRect(x - 1, y - 1, TANK + 2, TANK + 2);
  }
}

function drawBullet(b) {
  ctx.fillStyle = b.owner === "player" ? "#ffe98a" : "#d0d4da";
  ctx.beginPath();
  ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
  ctx.fill();
  if (b.power) { ctx.fillStyle = "#fff"; ctx.fillRect(b.x - 1, b.y - 3, 2, 6); }
}

function drawPup(p) {
  const colors = { shield: "#4fc3f7", star: "#ffd54f", bomb: "#ef5350", life: "#66bb6a" };
  const icon = { shield: "🛡", star: "★", bomb: "💣", life: "❤" };
  ctx.save();
  ctx.globalAlpha = (p.life < 120 && (p.life & 4)) ? 0.35 : 1;
  ctx.fillStyle = colors[p.type];
  ctx.fillRect(p.x, p.y, TANK, TANK);
  ctx.fillStyle = "#111";
  ctx.font = "16px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(icon[p.type], p.x + TANK / 2, p.y + TANK / 2 + 1);
  ctx.restore();
}

function drawMenu(title, subtitle, items, selected) {
  ctx.fillStyle = "rgba(0,0,0,0.78)"; ctx.fillRect(0, 0, CANVAS, CANVAS);
  ctx.fillStyle = "#ffcf3f"; ctx.font = "bold 34px monospace";
  ctx.textAlign = "center"; ctx.fillText(title, CANVAS / 2, CANVAS / 2 - 62);
  if (subtitle) {
    ctx.fillStyle = "#d8f0cf"; ctx.font = "14px monospace";
    ctx.fillText(subtitle, CANVAS / 2, CANVAS / 2 - 36);
  }
  ctx.font = "20px monospace";
  items.forEach((it, i) => {
    const y = CANVAS / 2 + i * 34;
    ctx.fillStyle = i === selected ? "#7ce65c" : "#d8f0cf";
    ctx.fillText((i === selected ? "▶ " : "  ") + it, CANVAS / 2, y);
  });
  ctx.fillStyle = "#4a9a3a"; ctx.font = "12px monospace";
  ctx.fillText("↑↓ 选择 · Enter 确认 · Esc 返回", CANVAS / 2, CANVAS / 2 + items.length * 34 + 4);
}

function drawOverlay() {
  if (state === "title") {
    drawMenu("坦克大战", "BATTLE CITY", ["开始游戏", "选择关卡"], menuIndex);
  } else if (state === "levelselect") {
    drawMenu("选择关卡", "SELECT STAGE", ["关卡 1", "关卡 2", "关卡 3"], menuIndex);
  } else if (state === "paused") {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, CANVAS, CANVAS);
    ctx.fillStyle = "#fff"; ctx.font = "bold 28px monospace";
    ctx.textAlign = "center"; ctx.fillText("已暂停", CANVAS / 2, CANVAS / 2);
  } else if (state === "levelclear" || state === "win" || state === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, CANVAS, CANVAS);
    ctx.fillStyle = "#ffcf3f"; ctx.font = "bold 30px monospace";
    ctx.textAlign = "center";
    const msg = state === "win" ? "恭喜通关！" : state === "gameover" ? "游戏结束" : "关卡完成！";
    ctx.fillText(msg, CANVAS / 2, CANVAS / 2 - 14);
    ctx.fillStyle = "#d8f0cf"; ctx.font = "16px monospace";
    ctx.fillText("得分 " + score, CANVAS / 2, CANVAS / 2 + 20);
    if ((frame >> 4) & 1) ctx.fillText("按 ENTER " + (state === "gameover" ? "重开本关" : "继续"), CANVAS / 2, CANVAS / 2 + 58);
  }
}

/* ================= HUD ================= */
function updateHUD() {
  document.getElementById("score").textContent = score;
  document.getElementById("hi").textContent = hiscore;
  document.getElementById("stage").textContent = stage;
  document.getElementById("base-hp").textContent = baseHp;

  const livesEl = document.getElementById("lives");
  livesEl.innerHTML = "";
  for (let i = 0; i < Math.max(0, lives); i++) {
    const d = document.createElement("span"); d.className = "tank-ico"; livesEl.appendChild(d);
  }

  const en = remaining + tanks.filter(t => t.isEnemy).length;
  const enEl = document.getElementById("enemies");
  enEl.innerHTML = "";
  for (let i = 0; i < Math.min(en, 14); i++) {
    const d = document.createElement("span"); d.className = "tank-ico e"; enEl.appendChild(d);
  }

  const pw = [];
  if (player.shield > 0) pw.push("护盾");
  if (player.power > 0) pw.push("强化弹");
  if (player.invincible > 0) pw.push("无敌");
  document.getElementById("pwr-lbl").textContent = "状态 " + (pw.length ? pw.join("/") : "NONE");
}
function setStatus(t) {
  document.getElementById("status").innerHTML = t;
  syncActionButtons();
}
function syncActionButtons() {
  const show = state !== "playing";
  const confirm = document.getElementById("confirm");
  const back = document.getElementById("back");
  if (confirm) confirm.style.display = show ? "" : "none";
  if (back) back.style.display = show ? "" : "none";
}

/* ================= 主循环 ================= */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ================= 输入事件 ================= */
function menuUp() {
  if (state === "title") { menuIndex = menuIndex === 0 ? 1 : 0; sfx.move(); }
  else if (state === "levelselect") { menuIndex = (menuIndex + 2) % 3; sfx.move(); }
}
function menuDown() {
  if (state === "title") { menuIndex = menuIndex === 0 ? 1 : 0; sfx.move(); }
  else if (state === "levelselect") { menuIndex = (menuIndex + 1) % 3; sfx.move(); }
}
function pressEnter() {
  if (state === "title") {
    if (menuIndex === 0) resetAll();
    else { state = "levelselect"; menuIndex = 0; setStatus("选择关卡 — ↑↓ 选择 · Enter 确认 · Esc 返回"); }
  } else if (state === "levelselect") {
    startGame(menuIndex + 1);
  } else if (state === "gameover") {
    startGame(stage);   // 重开本关，不回第 1 关
  } else if (state === "levelclear") {
    stage++; startStage(); setStatus("关卡 " + stage);
  } else if (state === "win") {
    resetAll();
  } else if (state === "paused") {
    state = "playing"; setStatus("战斗中…");
  }
}
function pressEscape() {
  if (state === "levelselect" || state === "gameover" || state === "win" || state === "levelclear" || state === "paused") {
    state = "title"; menuIndex = 0; setStatus("按 Enter 开始");
  }
}
window.addEventListener("keydown", e => {
  const k = e.key;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === " " || k === "Space" || k === "j" || k === "J") keys["fire"] = true;

  // 静音（任意状态可用）
  if (k === "m" || k === "M") {
    muted = !muted;
    document.getElementById("hud").classList.toggle("muted", muted);
    setStatus(muted ? "已静音" : "声音开启");
    return;
  }

  // 菜单导航（主菜单 / 选关）
  if (state === "title" || state === "levelselect") {
    if (k === "ArrowUp" || k === "w" || k === "W") menuUp();
    else if (k === "ArrowDown" || k === "s" || k === "S") menuDown();
    else if (k === "Enter") pressEnter();
    else if (k === "Escape") pressEscape();
    else if (state === "levelselect" && (k === "1" || k === "2" || k === "3")) startGame(+k);
    return;
  }

  // 游戏内 / 结束状态
  if (k === "Enter") pressEnter();
  else if (k === "Escape") pressEscape();
  else if (k === "p" || k === "P") {
    if (state === "playing") { state = "paused"; setStatus("已暂停 — 按 P 继续"); }
    else if (state === "paused") { state = "playing"; setStatus("战斗中…"); }
  }
});
window.addEventListener("keyup", e => {
  keys[e.key] = false;
  if (e.key === " " || e.key === "Space") keys["fire"] = false;
});

// 触屏按钮
function bindTouch(btn, key) {
  const press = ev => {
    ev.preventDefault();
    if (key === "fire") { keys["fire"] = true; return; }
    // 菜单状态下方向键用于导航（单次触发）
    if (state === "title" || state === "levelselect") {
      if (key === "up") menuUp();
      else if (key === "down") menuDown();
      return;
    }
    keys[key] = true;
  };
  const release = () => { keys[key] = false; if (key === "fire") keys["fire"] = false; };
  btn.addEventListener("touchstart", press, { passive: false });
  btn.addEventListener("touchend", release);
  btn.addEventListener("touchcancel", release);
  btn.addEventListener("mousedown", press);
  btn.addEventListener("mouseup", release);
  btn.addEventListener("mouseleave", release);
}
document.querySelectorAll("#dpad button").forEach(b => bindTouch(b, b.dataset.k));
bindTouch(document.getElementById("fire"), "fire");
document.getElementById("confirm").addEventListener("click", () => pressEnter());
document.getElementById("back").addEventListener("click", () => { sfx.move(); pressEscape(); });

// 菜单：鼠标点击 / 触屏选择
function menuItemAt(y, n) {
  for (let i = 0; i < n; i++) {
    if (Math.abs(y - (CANVAS / 2 + i * 34)) < 16) return i;
  }
  return -1;
}
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  const y = (e.clientY - r.top) * (CANVAS / r.height);
  if (state === "title") {
    const i = menuItemAt(y, 2);
    if (i === 0) resetAll();
    else if (i === 1) { state = "levelselect"; menuIndex = 0; setStatus("选择关卡 — ↑↓ 选择 · Enter 确认 · Esc 返回"); }
  } else if (state === "levelselect") {
    const i = menuItemAt(y, 3);
    if (i >= 0) startGame(i + 1);
  }
});

/* ================= 启动 ================= */
hiscore = +(localStorage.getItem("tank-hi") || 0);
loadMap(MAPS[0]);
player = makeTank(PLAYER_SPAWN[0], PLAYER_SPAWN[1], "up", false);
tanks = [player]; bullets = []; pups = []; particles = [];
updateHUD();
setStatus("↑↓ 选择菜单 · Enter 确认 · Esc 返回");
loop();
</script>
</body>
